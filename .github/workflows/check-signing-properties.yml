name: Check signing properties

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - name: Check LOCAL_TEST_JKS without exposing values
        shell: bash
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
        run: bash .github/scripts/check-signing-properties.sh
