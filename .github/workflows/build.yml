name: Versanium Build

on:
  workflow_dispatch:
    inputs:
      f11_test_build:
        description: 'Create Test artifact (false reserved for an approved Release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Initial migration: change only after explicit user approval and device testing.
  VERSANIUM_RELEASE_APPROVED: 'false'

jobs:
  build:
    # Job-level guard is evaluated before runner allocation. Forks cannot build.
    if: ${{ github.repository == 'Nvoid911/Versanium' || github.repository == 'Nvoid911-Lab/Versanium' }}
    # Shared by Primary/Secondary; edit this reviewed map to change runner providers.
    runs-on: ${{ fromJSON('{"Nvoid911/Versanium":"sengi-standard-8-ubuntu-2404","Nvoid911-Lab/Versanium":"blacksmith-8vcpu-ubuntu-2404"}')[github.repository] || 'versanium-repository-not-allowed' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Enforce test-first migration and prepared original assets
        env:
          TEST_BUILD: ${{ inputs.f11_test_build && 'true' || 'false' }}
        run: |
          if [ "$TEST_BUILD" != "true" ] && [ "$VERSANIUM_RELEASE_APPROVED" != "true" ]; then
            echo "Only a test artifact is authorized before device approval." >&2
            exit 1
          fi
          python3 tools/versanium/apply.py --check-assets
          python3 tools/check_environment_zoom_revision.py --repository "$PWD"

      - name: Set ENV
        run: |
          chmod +x *.sh
          VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
          # Retain the existing build/signing path; isolate only the Test delivery.
          F11_TEST_BUILD: '1'
          VERSANIUM_TEST_BUILD: ${{ inputs.f11_test_build && '1' || '0' }}
        run: ./build.sh

      - name: Stage Test APK
        if: ${{ inputs.f11_test_build }}
        run: python3 tools/versanium/package_apk.py --source chromium/src/out/release --version "$VERSION" --test

      - name: Upload Versanium Test
        if: ${{ inputs.f11_test_build }}
        uses: actions/upload-artifact@v4
        with:
          name: Versanium-Test
          path: dist/Versanium-${{ env.VERSION }}_Test.apk
          if-no-files-found: error
          retention-days: 7

      - name: Stage approved Release APK
        if: ${{ !inputs.f11_test_build && env.VERSANIUM_RELEASE_APPROVED == 'true' && github.repository == 'Nvoid911/Versanium' }}
        run: python3 tools/versanium/package_apk.py --source chromium/src/out/release --version "$VERSION"

      - name: Publish approved Release
        if: ${{ !inputs.f11_test_build && env.VERSANIUM_RELEASE_APPROVED == 'true' && github.repository == 'Nvoid911/Versanium' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Versanium ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          body: |
            Versanium ${{ env.VERSION }}

            Architecture: arm64-v8a
            Based on Titanium Browser for Android.

            APK:
            Versanium-${{ env.VERSION }}_arm64-v8a.apk
          files: dist/Versanium-${{ env.VERSION }}_arm64-v8a.apk

      - name: Attest approved Release
        if: ${{ !inputs.f11_test_build && env.VERSANIUM_RELEASE_APPROVED == 'true' && github.repository == 'Nvoid911/Versanium' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Versanium-${{ env.VERSION }}_arm64-v8a.apk
