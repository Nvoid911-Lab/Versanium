name: Versanium report
description: Report a bug or suggest an improvement for Versanium.
body:
  - type: markdown
    attributes:
      value: |
        Report a bug or suggest an improvement for Versanium.
        Please check the [Versanium issue tracker](https://github.com/Nvoid911-Lab/Versanium/issues) for duplicates.
        You do not need to determine whether a problem originates in Chromium or Titanium Browser.
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I have checked the Versanium issue tracker and confirmed that this issue has not already been reported.
          required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Galaxy S23
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 16 / One UI 8.5
  - type: input
    id: versanium-version
    attributes:
      label: Versanium version
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Smartphone
        - Samsung DeX
        - Other
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem or improvement, and steps to reproduce where applicable. Do not include passwords, tokens, or private browsing information.
    validations:
      required: true
