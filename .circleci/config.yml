version: 2.1

jobs:
  circleci-large-gen2-test:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen2
    environment:
      DEBIAN_FRONTEND: noninteractive
      F11_TEST_BUILD: "1"
      VERSANIUM_TEST_BUILD: "1"
    steps:
      - checkout:
          method: full

      - run:
          name: Initialize submodules
          command: |
            set -euxo pipefail
            git submodule sync --recursive
            git submodule update --init --recursive

      - run:
          name: Verify Versanium Test inputs
          command: |
            set -euxo pipefail
            python3 tools/versanium/apply.py --check-assets
            python3 tools/check_environment_zoom_revision.py --repository "$PWD"
            grep -F 'io.github.nvoid911.versanium.test' tools/configure_f11_identity.py

      - run:
          name: Verify migration branch checkout
          command: |
            set -euxo pipefail
            git rev-parse --abbrev-ref HEAD || true
            git rev-parse HEAD
            test -f build.sh
            test -d vanadium

workflows:
  circleci-large-gen2-test:
    jobs:
      - circleci-large-gen2-test
