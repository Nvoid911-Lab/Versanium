# Triggered by GitHub App push trigger smoke test.
version: 2.1

jobs:
  large-gen2-smoke-test:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen2
    steps:
      - checkout:
          method: full

      - run:
          name: Verify large.gen2 resources
          command: |
            set -euxo pipefail
            echo "=== System ==="
            uname -a
            echo
            echo "=== CPU ==="
            nproc
            lscpu
            echo
            echo "=== Memory ==="
            free -h
            echo
            echo "=== Disk ==="
            df -h /
            echo
            echo "=== Tooling ==="
            git --version
            python3 --version

      - run:
          name: Verify Versanium checkout
          command: |
            set -euxo pipefail
            test -f build.sh
            test -d vanadium
            git status --short
            git rev-parse HEAD

workflows:
  circleci-large-gen2-test:
    jobs:
      - large-gen2-smoke-test
