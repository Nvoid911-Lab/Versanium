version: 2.1

jobs:
  circleci-large-gen2-test:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen2
    steps:
      - checkout:
          method: full

      - run:
          name: Verify migration branch checkout
          command: |
            set -euxo pipefail
            git rev-parse --abbrev-ref HEAD || true
            git rev-parse HEAD
            test -f build.sh
            test -d vanadium

workflows:
  circleci-large-gen2-test:
    jobs:
      - circleci-large-gen2-test
